# Generate the banner automatically with the account's public GitHub avatar.
name: Refresh profile banner
on:
  push:
    paths:
      - 'scripts/build_banner.py'
      - '.github/workflows/refresh-banner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Generate banner with public GitHub avatar
        run: python scripts/build_banner.py
      - name: Commit generated banner when changed
        run: |
          git add assets/hero.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: refresh banner with GitHub avatar'
          git push
